[[groups]]
name = "admin"
level = "authPriv"
rules = [ {read = true, write = true, include=[ "1.3.6.1" ], exclude = [ ]} ]

[[groups]]
name = "user"
level = "authNoPriv"
rules = [ {read = true, write = false, include=[ "1.3.6.1" ], exclude = [ "1.3.6.1.6.3.15.1.2.2" ]} ]
 # Don't let user read user table


[[groups]]
name = "guest"
level = "noAuthNoPriv"
rules = [ {read = true, write = false, context = "guest", include=[ "1.3.6.1" ], exclude = [ "1.3.6.1.6.3.15.1.2.2" ]} ]
# Don't let guest read user table in guest context


